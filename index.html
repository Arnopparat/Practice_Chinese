<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7a59">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%BC%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ฝึกพูดจีน">
<title>ฝึกพูด 我的家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<style>
:root{
  --bg:#fff8ee; --card:#ffffff; --ink:#3a2e2a; --muted:#8a7a70;
  --zh:#c0392b; --py:#2c3e50; --thr:#b03a5b; --mean:#2e5fa8;
  --accent:#ff8a3d; --accent2:#4caf7a; --accent3:#5b8def; --line:#f1e2cf;
  --ok:#2e9d5b; --miss:#d9534f; --now:#fff1c2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mali","Sarabun",system-ui,sans-serif;font-size:18px}
.zh{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}
header{background:linear-gradient(135deg,#ff9a56,#ff6f61);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}
header h1{margin:0;font-size:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1 small{font-size:15px;opacity:.9;font-weight:400}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.tab{border:0;background:#ffffff33;color:#fff;padding:10px 14px;border-radius:14px 14px 0 0;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--bg);color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:16px}
.panel{display:none}.panel.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:14px}
.bar label{display:flex;align-items:center;gap:6px;font-size:16px}
select,input[type=text],input[type=number]{font:inherit;font-size:16px;padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
button.b{font:inherit;font-weight:600;border:0;border-radius:14px;padding:10px 14px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 3px 0 #0002;transition:transform .05s}
button.b:active{transform:translateY(2px);box-shadow:none}
.pagebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pg{font:inherit;font-weight:700;font-size:18px;border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:16px;padding:10px 16px;cursor:pointer}
.pg.on{background:#ff8a3d;border-color:#ff8a3d;color:#fff;box-shadow:0 3px 0 #0002}
.pgsel{flex-basis:100%;font-size:16px;color:var(--ink);background:#fff3e0;border-radius:10px;padding:6px 10px}
.pagehead{font-size:22px;font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.circ{display:inline-grid;place-items:center;width:38px;height:38px;border:3px solid var(--ink);border-radius:50%}
button.b.t{background:#9b59b6} button.b.k{background:#e84393} button.b.k2{background:#fd79a8}
.clip{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.clip audio{width:100%;margin-top:8px}
button.b.g{background:var(--accent2)} button.b.bl{background:var(--accent3)} button.b.gr{background:#9aa3ad} button.b.r{background:#e2574c}
button.b.sm{padding:7px 10px;font-size:15px;border-radius:11px}
button.b:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:38px 1fr;gap:10px;transition:background .2s}
.card.now{background:var(--now);border-color:#f4c84a}
.num{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.l-zh{font-size:26px;color:var(--zh);line-height:1.4}
.l-py{font-size:18px;color:var(--py);font-family:"Segoe UI",Arial,sans-serif}
.l-th{font-size:18px;color:var(--thr)}
.l-mean{font-size:17px;color:var(--mean)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stars{color:#f5b301;font-size:18px;letter-spacing:1px}
.hidepy .l-py,.hideth .l-th,.hidemean .l-mean{display:none}
/* practice */
.big{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:20px;text-align:center}
.big .l-zh{font-size:40px}
.big .l-py{font-size:24px}
.big .l-th{font-size:24px}
.big .l-mean{font-size:22px}
.big .acts{justify-content:center;gap:10px}
.big .acts .b{font-size:20px;padding:14px 18px}
.mic{font-size:26px!important;padding:18px 28px!important;border-radius:40px!important}
.mic.live{background:#e2574c!important;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px #e2574c33}}
.result{margin-top:14px;min-height:80px}
.result .score{font-size:44px;font-weight:700}
.result .bigstars{font-size:44px;color:#f5b301}
.ch.ok{color:var(--ok)} .ch.miss{color:var(--miss);text-decoration:underline wavy}
.heard{color:var(--muted);font-size:18px}
.prog{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 14px}
.prog>div{height:100%;background:var(--accent2);width:0;transition:width .3s}
.nav{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.levels{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.levels .b{background:#d8c8b6}.levels .b.on{background:var(--accent3)}
.blur{filter:blur(9px);cursor:pointer;user-select:none}
.warn{background:#fff0f0;border:2px solid #f3b9b5;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:16px}
.help h3{margin:18px 0 6px}
.help li{margin:4px 0}
.muted{color:var(--muted);font-size:15px}
@media (max-width:600px){
  body{font-size:16px} .l-zh{font-size:22px} .big .l-zh{font-size:30px} .big .l-py,.big .l-th{font-size:19px}
  .card{grid-template-columns:1fr} .num{width:30px;height:30px}
}
.more{display:none}
.mbar{display:none}
@media (max-width:600px){
  header{padding:10px 12px 0} header h1{font-size:19px} header h1 small{display:none}
  .tab{padding:9px 11px;font-size:15px}
  main{padding:12px 12px 96px}
  .card .acts .x{display:none} .card.open .acts .x{display:inline-block}
  .more{display:inline-block} .card.open .more{background:#6c757d}
  .card .acts .b{padding:10px 12px;font-size:16px;flex:1 1 auto}
  .pg{font-size:15px;padding:8px 10px;flex:1 1 28%}
  .pagebar .muted{flex-basis:100%}
  .bar{padding:8px 10px} .bar label{font-size:15px}
  main #playFlow,main #playSmooth,main #playAll,main #stopBtn{display:none}
  .mbar{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:9;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fffdf8ee;backdrop-filter:blur(6px);border-top:2px solid var(--line)}
  .mbar .b{flex:1;font-size:15px;padding:13px 4px;white-space:nowrap} .mbar .b.gr{flex:0 0 50px}
  body:not(.on-learn) .mbar{display:none}
  .big{padding:14px} .big .acts .b{font-size:17px;padding:12px 12px;flex:1 1 40%}
  .mic{flex:1 1 100%!important}
  .levels .b{flex:1 1 45%}
  .nav .b{padding:10px 12px}
  .result .score,.result .bigstars{font-size:36px}
}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
</style>

<style>
#gate{position:fixed;inset:0;z-index:99;display:grid;place-items:center;overflow:hidden;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  background:radial-gradient(120% 90% at 10% 0%,#ffd29d 0%,#ff9a6b 45%,#f0566b 100%);font-family:"Mali",system-ui,sans-serif}
#gate .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:float 14s ease-in-out infinite}
#gate .b1{width:340px;height:340px;background:#fff3b0;top:-90px;left:-80px}
#gate .b2{width:300px;height:300px;background:#ff5e7e;bottom:-90px;right:-70px;animation-delay:-5s}
#gate .b3{width:220px;height:220px;background:#ffc46b;top:45%;left:60%;animation-delay:-9s}
@keyframes float{50%{transform:translate(30px,-25px) scale(1.08)}}
#gate .hz{position:absolute;color:#ffffff40;font:700 64px "Noto Sans SC",sans-serif;animation:drift 18s linear infinite;user-select:none}
@keyframes drift{from{transform:translateY(110vh) rotate(-8deg)}to{transform:translateY(-20vh) rotate(8deg)}}
#gate .box{position:relative;width:min(380px,100%);padding:26px 22px 20px;border-radius:32px;text-align:center;
  background:#ffffffd9;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 20px 60px #8a1f2a40,inset 0 1px 0 #fff;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#gate .logo{width:84px;height:84px;margin:-62px auto 8px;border-radius:26px;display:grid;place-items:center;font-size:46px;
  background:linear-gradient(135deg,#ff8a3d,#f0566b);box-shadow:0 10px 24px #f0566b66;border:4px solid #fff}
#gate h2{margin:6px 0 2px;font-size:26px;color:#3a2e2a}
#gate .sub{margin:0;color:#c0392b;font:700 18px "Noto Sans SC",sans-serif;letter-spacing:2px}
#gate .hint{margin:6px 0 0;color:#8a7a70;font-size:15px}
#gate .dots{display:flex;justify-content:center;gap:12px;margin:18px 0 20px}
#gate .dots i{width:16px;height:16px;border-radius:50%;background:#f3dfd0;display:block;transition:transform .15s,background .15s}
#gate .dots i.f{background:linear-gradient(135deg,#ff8a3d,#f0566b);transform:scale(1.25)}
#gate .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}
#gate .pad button{aspect-ratio:1.35;font:700 26px "Mali",system-ui,sans-serif;border:0;border-radius:20px;cursor:pointer;
  color:#3a2e2a;background:#fff;box-shadow:0 4px 0 #f1d9c6,0 6px 14px #0000000d;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .06s}
#gate .pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #f1d9c6}
#gate .pad button.fn{background:transparent;box-shadow:none;font-size:22px;color:#8a7a70}
#gate .pad button.ok{background:linear-gradient(135deg,#4caf7a,#2e9d5b);color:#fff;box-shadow:0 4px 0 #237a46}
#gate .row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:15px;color:#6b5d55}
#gate .sw{display:flex;align-items:center;gap:8px;cursor:pointer}
#gate .sw input{display:none}
#gate .sw span{width:42px;height:24px;border-radius:12px;background:#e5d6ca;position:relative;transition:.2s}
#gate .sw span:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
#gate .sw input:checked+span{background:#4caf7a} #gate .sw input:checked+span:after{left:21px}
#gate .msg{min-height:22px;margin-top:10px;font-weight:700;color:#d9534f}
#gate .msg.okm{color:#2e9d5b}
#gate.shake .box{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
#gate.done{animation:fade .5s forwards} @keyframes fade{to{opacity:0;transform:scale(1.04)}}
#gate .spin{display:inline-block;width:16px;height:16px;border:3px solid #2e9d5b55;border-top-color:#2e9d5b;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}
@media (max-height:640px){#gate .pad button{aspect-ratio:1.7;font-size:22px}#gate .logo{width:64px;height:64px;font-size:34px;margin-top:-50px}}
</style>
</head>
<body>
<div id="gate">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="hz" style="left:6%;animation-delay:-2s">家</div>
  <div class="hz" style="left:28%;animation-delay:-11s;font-size:44px">爱</div>
  <div class="hz" style="left:70%;animation-delay:-6s">学</div>
  <div class="hz" style="left:88%;animation-delay:-15s;font-size:48px">好</div>
  <div class="box">
    <div class="logo">🐼</div>
    <h2>ฝึกพูดภาษาจีน</h2>
    <p class="sub">《我的家》</p>
    <p class="hint">ใส่รหัสผ่าน 6 หลักเพื่อเข้าโปรแกรม</p>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
    <div class="row">
      <label class="sw"><input type="checkbox" id="remember" checked><span></span> จำรหัสในเครื่องนี้</label>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id);
let code="", busy=false;
const dots=()=>{$("dots").innerHTML=Array.from({length:LEN},(_,i)=>`<i class="${i<code.length?"f":""}"></i>`).join("");};
$("pad").innerHTML=[1,2,3,4,5,6,7,8,9,"⌫",0,"✓"].map(k=>`<button type="button" class="${k==="⌫"?"fn":k==="✓"?"ok":""}" data-k="${k}">${k}</button>`).join("");
dots();
const msg=(t,ok)=>{ const m=$("msg"); m.className="msg"+(ok?" okm":""); m.innerHTML=t; };
if(!window.crypto||!crypto.subtle) msg("ต้องเปิดผ่าน https:// (เช่น GitHub Pages)");
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function enter(key){
  const d=ub(DATA);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},key,d.slice(12));
  const P=JSON.parse(new TextDecoder().decode(pt));
  window.__KEY=key; window.__ASSETS=P.assets;
  const g=$("gate");
  document.body.className="on-learn";
  document.body.insertAdjacentHTML("afterbegin",P.html);
  const s=document.createElement("script"); s.textContent=P.js; document.body.appendChild(s);
  g.classList.add("done"); setTimeout(()=>g.remove(),500);
}
async function tryCode(){
  if(busy) return; busy=true; msg('<span class="spin"></span>กำลังเข้าสู่โปรแกรม…',true);
  try{
    const key=await derive(code); await enter(key);
    if($("remember").checked){ try{ localStorage.setItem("wdj_k",btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw",key))))+"|"+SALT); }catch(e){} }
    else { try{localStorage.removeItem("wdj_k");}catch(e){} }
  }catch(e){
    busy=false; code=""; dots(); msg("รหัสไม่ถูกต้อง ลองใหม่อีกครั้งนะ 🙂");
    if(navigator.vibrate) navigator.vibrate(120);
    $("gate").classList.add("shake"); setTimeout(()=>$("gate")&&$("gate").classList.remove("shake"),450);
  }
}
function press(k){
  if(busy) return;
  if(k==="⌫") code=code.slice(0,-1);
  else if(k==="✓"){ if(code.length) tryCode(); return; }
  else if(code.length<LEN) code+=k;
  if(!busy) msg(""); dots(); if(code.length===LEN) tryCode();
}
$("pad").addEventListener("click",e=>{ const k=e.target.closest("button")?.dataset.k; if(k!=null) press(k); });
document.addEventListener("keydown",e=>{ if(!$("gate")) return;
  if(/^\d$/.test(e.key)) press(e.key); else if(e.key==="Backspace") press("⌫"); else if(e.key==="Enter") press("✓"); });
// เคยจำรหัสไว้ในเครื่องนี้ -> เข้าอัตโนมัติ
(async()=>{ try{ const v=localStorage.getItem("wdj_k"); if(!v) return; const [k,s]=v.split("|"); if(s!==SALT) return;
  busy=true; msg('<span class="spin"></span>กำลังเข้าสู่โปรแกรม…',true);
  const key=await crypto.subtle.importKey("raw",ub(k),{name:"AES-GCM"},true,["decrypt"]); await enter(key);
}catch(e){ busy=false; msg(""); try{localStorage.removeItem("wdj_k");}catch(x){} } })();
})();
